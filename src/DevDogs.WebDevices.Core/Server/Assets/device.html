<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>SimHub device</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { position: fixed; top: 0; left: 0; }
    /* Old iOS Safari sizes iframes to their content: 1px + min-width pins the width, script pins the height. */
    #dash {
      position: absolute; top: 0; left: 0; width: 1px; min-width: 100%; height: 100%;
      border: 0; display: none; background: #000;
    }
    #msg {
      position: absolute; top: 50%; left: 0; width: 100%; padding: 0 16px; box-sizing: border-box;
      -webkit-transform: translateY(-50%); transform: translateY(-50%);
      color: #ccc; font: 18px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    #msg small { display: block; margin-top: 8px; color: #777; font-size: 14px; }
    #status {
      position: absolute; right: 12px; bottom: 10px; display: none;
      color: #555; font: 12px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; pointer-events: none;
    }
    /* Offline: a black screen and the corner text only, so a device left on does not burn in a frozen
       dashboard. Visibility (not display) keeps the frame loaded for when the connection comes back. */
    body.offline #dash, body.offline #msg { visibility: hidden; }
    /* Keep-awake video: black, 2px, on screen (browsers only count a visible playing video). */
    #awake { position: absolute; left: 0; bottom: 0; width: 2px; height: 2px; pointer-events: none; }
    /* Tap to start: catches the one tap that full screen needs, above the dashboard. */
    #tap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; -webkit-tap-highlight-color: transparent; }
    #tap span {
      position: absolute; left: 50%; bottom: 24px; -webkit-transform: translateX(-50%); transform: translateX(-50%);
      padding: 6px 14px; border-radius: 16px; background: rgba(0, 0, 0, 0.7); white-space: nowrap;
      color: #999; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-transition: opacity 1s; transition: opacity 1s;
    }
    /* The hint fades after a while so it does not burn in; the whole screen stays tappable. */
    #tap.quiet span { opacity: 0; }
  </style>
</head>
<body>
  <iframe id="dash" scrolling="no" allowfullscreen></iframe>
  <div id="msg">Connecting to SimHub&hellip;</div>
  <div id="status"></div>

  <div id="tap"><span></span></div>
  <script>
    // Plain ES5: the oldest supported browser is Safari 12 (iPad mini 2). See docs/adr/ADR-0002 and ADR-0003.
    (function () {
      var NOTICE_DELAY_MS = 3000; // brief drops (SimHub switching games) should not flash a notice
      var POLL_MS = 5000;
      var FIT_MS = 2000; // re-fit periodically too: a missed resize event must not leave the frame mis-sized
      var DRIFT_MS = 60000; // nudge the offline text now and then so it does not burn in either
      var HINT_MS = 10000; // how long the "tap" hint stays visible
      var AWAKE_REWIND_S = 3; // rewind the keep-awake video before it ends, so it never stops between loops

      var frame = document.getElementById('dash');
      var msg = document.getElementById('msg');
      var status = document.getElementById('status');
      var device = decodeURIComponent(location.pathname.split('/')[1] || '');
      var currentUrl = null;
      var source = null;
      var pollTimer = null;
      var noticeTimer = null;
      var driftTimer = null;
      var iconSet = false;
      var tap = document.getElementById('tap');
      var awake = document.getElementById('awake');
      var hintTimer = null;
      var wakeLock = null;
      var wakeLockPending = false;
      var wasFullscreen = false;

      document.title = 'SimHub · ' + device;

      function fit() {
        // A zero size (page still hidden, iOS standalone start-up) falls back to the CSS height.
        var height = window.innerHeight;
        frame.style.height = height > 0 ? height + 'px' : '';
      }

      function message(text, detail) {
        msg.textContent = text;
        if (detail) {
          var small = document.createElement('small');
          small.textContent = detail;
          msg.appendChild(small);
        }
        msg.style.display = 'block';
      }

      function hideFrame() {
        currentUrl = null;
        frame.style.display = 'none';
        frame.src = 'about:blank';
      }

      function drift() {
        status.style.right = (8 + Math.floor(Math.random() * 17)) + 'px';
        status.style.bottom = (6 + Math.floor(Math.random() * 13)) + 'px';
      }

      function connected() {
        if (noticeTimer) {
          clearTimeout(noticeTimer);
          noticeTimer = null;
        }
        if (driftTimer) {
          clearInterval(driftTimer);
          driftTimer = null;
        }
        document.body.className = '';
        status.style.display = 'none';
      }

      function disconnected(text) {
        if (!noticeTimer && status.style.display !== 'block') {
          noticeTimer = setTimeout(function () {
            noticeTimer = null;
            status.textContent = text;
            status.style.display = 'block';
            document.body.className = 'offline';
            drift();
            if (!driftTimer) {
              driftTimer = setInterval(drift, DRIFT_MS);
            }
          }, NOTICE_DELAY_MS);
        }
      }

      function setHomeScreenIcon(simHubPort) {
        // Borrow SimHub's own icon for "Add to Home Screen".
        if (iconSet) {
          return;
        }
        iconSet = true;
        var link = document.createElement('link');
        link.rel = 'apple-touch-icon';
        link.href = location.protocol + '//' + location.hostname + ':' + simHubPort + '/favicons/apple-icon-180x180.png';
        document.head.appendChild(link);
      }

      function show(p) {
        connected();
        setHomeScreenIcon(p.simHubPort);
        if (!p.path) {
          hideFrame();
          if (p.notice) {
            // The chosen page cannot be shown yet (Navigation Dash missing or loading); it appears once it can.
            message(p.notice, p.noticeDetail);
          } else {
            message('No dashboard is set for this state.',
              p.device + ' · ' + p.state + (p.game ? ' · ' + p.game : ''));
          }
          return;
        }
        msg.style.display = 'none';
        frame.style.display = 'block';
        fit();
        // The page's own host, so it works whatever address the device used; the port is per target
        // (SimHub's web server, or Navigation Dash's). An unchanged address keeps the frame as it is.
        var url = location.protocol + '//' + location.hostname + ':' + (p.port || p.simHubPort) + p.path;
        if (url !== currentUrl) {
          currentUrl = url;
          frame.src = url;
        }
      }

      function notConfigured() {
        connected();
        hideFrame();
        message('"' + device + '" is not configured in SimHub.', 'Add it in SimHub; this page will pick it up.');
      }

      function poll() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'state?t=' + new Date().getTime());
        xhr.timeout = POLL_MS;
        xhr.onload = function () {
          if (xhr.status === 200) {
            show(JSON.parse(xhr.responseText));
            if (window.EventSource && !source) {
              stopPolling();
              listen();
            }
          } else if (xhr.status === 404) {
            notConfigured();
          } else {
            disconnected('Waiting for SimHub…');
          }
        };
        xhr.onerror = xhr.ontimeout = function () {
          disconnected('Waiting for SimHub…');
        };
        xhr.send();
      }

      function startPolling() {
        if (!pollTimer) {
          poll();
          pollTimer = setInterval(poll, POLL_MS);
        }
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function listen() {
        source = new EventSource('events');
        source.onopen = connected;
        source.addEventListener('dash', function (e) {
          show(JSON.parse(e.data));
        });
        source.addEventListener('gone', function () {
          source.close();
          source = null;
          notConfigured();
          startPolling();
        });
        source.onerror = function () {
          if (source && source.readyState === 2) {
            // The browser gave up (for example a 404 after the device was removed): poll instead.
            source = null;
            startPolling();
          } else {
            // The browser retries by itself; brief drops keep the dashboard, longer ones go black.
            disconnected('Reconnecting…');
          }
        };
      }

      // Tap to start. Over plain HTTP the page is not a secure context: full screen still works but only from a
      // tap, and Screen Wake Lock is missing (and Safari 12 has none at all), so a tiny muted looping video keeps
      // the screen on instead. See docs/adr/ADR-0010.
      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement ||
          document.webkitCurrentFullScreenElement || null;
      }

      function canFullscreen() {
        var root = document.documentElement;
        var enabled = document.fullscreenEnabled !== undefined ? document.fullscreenEnabled : document.webkitFullscreenEnabled;
        return enabled !== false && !!(root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen);
      }

      function inAppMode() {
        // An iOS home-screen launch is already full screen.
        return window.navigator.standalone === true ||
          !!(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches);
      }

      function showTap(text) {
        tap.firstChild.textContent = text;
        tap.className = '';
        tap.style.display = 'block';
        if (hintTimer) {
          clearTimeout(hintTimer);
        }
        hintTimer = setTimeout(function () {
          hintTimer = null;
          tap.className = 'quiet';
        }, HINT_MS);
      }

      function hideTap() {
        tap.style.display = 'none';
      }

      function playAwakeVideo(fromTap) {
        awake.muted = true;
        var played;
        try {
          played = awake.play();
        } catch (e) {
          played = null;
        }
        if (played && played.then) {
          played.then(null, function () {
            // Muted autoplay refused (iOS Low Power Mode, data saver): a tap may start it. Refused even from a
            // tap: give up rather than ask again and again.
            if (!fromTap && tap.style.display !== 'block') {
              showTap('Tap to keep the screen on');
            }
          });
        }
      }

      function keepAwake(fromTap) {
        if (document.hidden) {
          return;
        }
        if (navigator.wakeLock) {
          if (wakeLock || wakeLockPending) {
            return;
          }
          wakeLockPending = true;
          navigator.wakeLock.request('screen').then(function (lock) {
            wakeLockPending = false;
            wakeLock = lock;
            lock.addEventListener('release', function () {
              wakeLock = null; // released when the page is hidden; taken again when it is shown
            });
          }, function () {
            wakeLockPending = false;
            playAwakeVideo(fromTap); // refused, for example by battery saver
          });
        } else {
          playAwakeVideo(fromTap);
        }
      }

      function enterFullscreen() {
        var root = document.documentElement;
        if (fullscreenElement()) {
          return;
        }
        try {
          var entered = root.requestFullscreen ? root.requestFullscreen({ navigationUI: 'hide' }) :
            root.webkitRequestFullscreen ? root.webkitRequestFullscreen() : root.webkitRequestFullScreen();
          if (entered && entered.then) {
            entered.then(null, function () {}); // refused: stay as is, no tap loop
          }
        } catch (e) {
          // Not allowed here (some in-app browsers): stay as is.
        }
      }

      function fullscreenChanged() {
        if (fullscreenElement()) {
          wasFullscreen = true;
          hideTap();
        } else if (wasFullscreen) {
          // Left full screen (back gesture, app switch): one tap brings it back.
          wasFullscreen = false;
          showTap('Tap for full screen');
        }
        fit();
      }

      function tapped() {
        hideTap();
        if (canFullscreen() && !inAppMode()) {
          enterFullscreen();
        }
        keepAwake(true);
      }

      tap.addEventListener('click', tapped);
      document.addEventListener('fullscreenchange', fullscreenChanged);
      document.addEventListener('webkitfullscreenchange', fullscreenChanged);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          keepAwake(false);
        }
      });
      awake.addEventListener('timeupdate', function () {
        if (awake.currentTime > AWAKE_REWIND_S) {
          awake.currentTime = 0;
        }
      });
      if (canFullscreen() && !inAppMode()) {
        showTap('Tap for full screen');
      }
      keepAwake(false);

      fit();
      setInterval(fit, FIT_MS);
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', function () {
        // iOS reports the new size only after the rotation animation.
        setTimeout(fit, 300);
      });

      if (window.EventSource) {
        listen();
      } else {
        startPolling();
      }
    })();
  </script>
</body>
</html>
